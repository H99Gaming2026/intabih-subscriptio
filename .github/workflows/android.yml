name: Build Intabih APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'intabih_android_v4_source-1.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o intabih_android_v4_source-1.zip -d .

      - name: Fix Nullable import
        run: |
          sed -i '/import androidx.annotation.Nullable;/d' app/src/main/java/com/intabih/subscription/MainActivity.java
          sed -i 's/onCreate(@Nullable Bundle state)/onCreate(Bundle state)/' app/src/main/java/com/intabih/subscription/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Intabih-APK
          path: app/build/outputs/apk/debug/app-debug.apk
